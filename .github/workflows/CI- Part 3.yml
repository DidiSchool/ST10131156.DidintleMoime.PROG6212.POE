name: RaceDay CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  check-docs-folder:
    name: Check Docs Folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs directory exists
        run: |
          if [ ! -d "Docs" ]; then
            echo "❌ Error: 'docs' folder is missing."
            exit 1
          fi
          echo "✅ 'docs' folder exists."

  check-docs-files:
    name: Check Required Documentation Files
    runs-on: ubuntu-latest
    needs: check-Docs-folder
    steps:
      - uses: actions/checkout@v4
      - name: Verify files exist
        run: |
          REQUIRED_FILES=(
            "Docs/erd.pdf"
            "Docs/API Endpoint plan.pdf"
            "Docs/Race Day SQL.sql"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing file: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest
    needs: check-Docs-files
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test --no-restore --verbosity normal